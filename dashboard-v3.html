<style>

var SAFETY_TIPS=[{title:'Heat Illness Prevention',text:'Drink at least 8 oz of water every 20 minutes in hot weather. Watch for heavy sweating, dizziness, and nausea — these are early heat exhaustion signs. Move to shade and cool down immediately; never push through symptoms on the course.'},{title:'Lightning Safety',text:'If you can hear thunder, you are within lightning strike range — seek shelter in a hard-topped building or vehicle immediately. Avoid open fairways, tall trees, and metal equipment. Wait a full 30 minutes after the last thunderclap before returning outside.'},{title:'Chemical and PPE Safety',text:'Always read the Safety Data Sheet before handling any pesticide or fertilizer. Wear required PPE including gloves, goggles, and respirator exactly as labeled. Never eat, drink, or touch your face while working with chemicals — wash hands thoroughly after use.'},{title:'Mower Safety',text:'Inspect all cutting units before operation and check for loose bolts and worn blades. Never operate a mower on slopes exceeding the safe rated angle. Keep all bystanders at least 100 feet away from active mowing operations at all times.'},{title:'UV Protection',text:'Apply SPF 30 or higher sunscreen before your shift starts and reapply every two hours. Wear UV-blocking sunglasses and a wide-brim hat throughout the day. UV exposure peaks between 10 AM and 3 PM — use shade breaks strategically during this window.'},{title:'Back Injury Prevention',text:'Bend at the knees and keep your back straight when lifting any heavy object. Hold loads close to your body and avoid twisting while carrying. For items over 50 pounds, always use mechanical assistance or ask a coworker — one lift is not worth weeks of pain.'},{title:'Hearing Protection',text:'Equipment noise above 85 dB requires hearing protection — always wear earplugs or earmuffs when operating blowers, mowers, or grinders. Long-term noise exposure without protection causes permanent, irreversible hearing loss. Keep your hearing gear accessible on every piece of equipment.'},{title:'Bee and Wildlife Awareness',text:'If you discover a ground bee or wasp nest, mark the area clearly and report it immediately — do not mow over it. Move calmly and slowly away from aggressive insects, as running triggers a chase response. Know the location of the nearest EpiPen on site.'},{title:'Cart Safety',text:'Never exceed rated cart speed limits, especially on slopes and near players. Secure all tools and equipment before moving — unsecured items become dangerous projectiles during stops. Always engage the parking brake on any incline before stepping off the cart.'},{title:'Electrical Hazard Awareness',text:'Treat all irrigation control boxes as energized until confirmed safe by a qualified person. Never work near electrical panels or controllers in wet conditions. If you observe damaged wiring, sparks, or burning smells, report immediately and keep others clear of the area.'},{title:'Eye Protection',text:'Wear ANSI-rated safety glasses or goggles when operating trimming equipment, blowers, or sprayers. Flying debris accounts for thousands of preventable eye injuries on golf courses each year. Prescription glasses alone do not provide adequate impact protection.'},{title:'Ergonomics and Posture',text:'Adjust equipment handles, seats, and controls to fit your body before starting any task. Take brief stretch breaks when performing repetitive motions like raking, edging, or hand watering. Report any persistent muscle or joint pain to your supervisor early — small issues become big injuries when ignored.'},{title:'Hydration Protocol',text:'Start your shift well hydrated — drink 16 oz of water before you begin. Sports drinks help replace electrolytes lost during heavy sweating in hot conditions. Dark yellow or amber urine means you are already dehydrated — drink water now and continue drinking throughout the day.'},{title:'Slips, Trips, and Falls',text:'Wet turf, uneven terrain, and cart path edges are the most common causes of golf course injuries. Wear footwear with appropriate grip for wet morning conditions. Clear hoses, cords, and equipment from walkways before moving any machinery.'}];

function sg(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function getDaily(){if(S.daily)return S.daily;var k=todayKey();var d=sg(k);if(!d){d={announcement:'Welcome to Haggin Oaks Golf Complex. Have a safe and productive day on the course.',courseStatus:'open',teeTime:'6:30 AM',pins:{1:'C',2:'C',3:'C',4:'C',5:'C',6:'C',7:'C',8:'C',9:'C',10:'C',11:'C',12:'C',13:'C',14:'C',15:'C',16:'C',17:'C',18:'C'},assignments:{}};ss(k,d)}S.daily=d;return d}

function eh(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

function fetchWx(cb){var now=Date.now();if(S.wxData&&now-S.wxFetched<600000){if(cb)cb(S.wxData);return}var url='https://api.open-meteo.com/v1/forecast?latitude=38.6048&longitude=-121.4310&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=soil_temperature_6cm,dew_point_2m,et0_fao_evapotranspiration,uv_index&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FLos_Angeles&forecast_days=5';var x=new XMLHttpRequest();x.open('GET',url,true);x.onload=function(){if(x.status===200){try{var d=JSON.parse(x.responseText);S.wxData=d;S.wxFetched=Date.now();if(cb)cb(d)}catch(e){if(cb)cb(null)}}else{if(cb)cb(null)}};x.onerror=function(){if(cb)cb(null)};x.send()}
function fmtTime12(iso){try{var d=new Date(iso);var h=d.getHours()%12||12;var m=d.getMinutes();return h+':'+(m<10?'0':'')+m+' '+(d.getHours()<12?'AM':'PM')}catch(e){return '--'}}

W['clock']={id:'clock',name:'Live Clock',icon:'&#128336;',size:'small',minRole:0,category:'overview',_iv:null,_tiv:null,render:function(el){el.innerHTML='<div class="clk-time"><span id="ck-h">--</span><span class="clk-colon">:</span><span id="ck-m">--</span></div><div class="clk-date" id="ck-date"></div><div class="clk-greet" id="ck-greet"></div><div class="clk-live"><div class="clk-ldot"></div><span class="clk-llbl">LIVE</span></div>'},onInit:function(){var self=this;function tick(){var n=new Date();var he=document.getElementById('ck-h');var me=document.getElementById('ck-m');var de=document.getElementById('ck-date');var ge=document.getElementById('ck-greet');if(!he)return;var hr=n.getHours();he.textContent=hr%12||12;me.textContent=(n.getMinutes()<10?'0':'')+n.getMinutes();var dns=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];var mos=['January','February','March','April','May','June','July','August','September','October','November','December'];if(de)de.textContent=dns[n.getDay()]+', '+mos[n.getMonth()]+' '+n.getDate()+', '+n.getFullYear();var g='Good morning';if(hr>=12&&hr<17)g='Good afternoon';else if(hr>=17)g='Good evening';if(ge)ge.textContent=g+', team.'}tick();self._iv=setInterval(tick,1000);function tbTick(){var n=new Date();var h=n.getHours()%12||12;var mi=n.getMinutes();var sc=n.getSeconds();var ap=n.getHours()<12?'AM':'PM';var te=document.getElementById('tb-time');var de=document.getElementById('tb-date');if(te)te.textContent=h+':'+(mi<10?'0':'')+mi+':'+(sc<10?'0':'')+sc+' '+ap;var dns2=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];var mos2=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];if(de)de.textContent=dns2[n.getDay()]+' '+mos2[n.getMonth()]+' '+n.getDate()}tbTick();self._tiv=setInterval(tbTick,1000)},onDestroy:function(){clearInterval(this._iv);clearInterval(this._tiv)}};
W['course-status']={id:'course-status',name:'Course Status',icon:'&#9971;',size:'small',minRole:0,category:'overview',render:function(el){var dd=getDaily();var s=dd.courseStatus||'open';var t=dd.teeTime||'6:30 AM';var canEdit=(S.role>=2);var smap={open:'COURSE OPEN',frost:'FROST DELAY',cart:'CART PATH ONLY',closed:'CLOSED'};var lbl=smap[s]||'COURSE OPEN';var cls=s==='open'?'open':s==='frost'?'frost':s==='cart'?'cart':'closed';var editHtml=canEdit?'<span class="edit-lnk" onclick="App.editCourseStatus()">Edit</span>':'';el.innerHTML='<div class="st-badge st-'+cls+'"><div class="st-sdot '+cls+'"></div>'+lbl+'</div>'+editHtml+'<div class="tee-lbl">FIRST TEE TIME</div><div class="tee-val">'+eh(t)+'</div>'},onInit:function(){}};
W['weather']={id:'weather',name:'Current Weather',icon:'&#127780;',size:'medium',minRole:0,category:'overview',_iv:null,_el:null,render:function(el){this._el=el;el.innerHTML='<div style="text-align:center;color:#6B7572;font-size:11px;padding:14px">Loading weather data…</div>';var self=this;fetchWx(function(d){self._draw(d)})},_draw:function(d){var el=this._el;if(!el)return;if(!d){el.innerHTML='<div style="text-align:center;color:#E96A97;font-size:11px;padding:14px">Weather data unavailable</div>';return}var c=d.current||{};var code=c.weather_code||0;var icon=WX_ICONS[code]||'&#127775;';var desc=WX_CODES[code]||'Unknown';var temp=Math.round(c.temperature_2m||70);var feels=Math.round(c.apparent_temperature||70);var wind=Math.round(c.wind_speed_10m||0);var hum=Math.round(c.relative_humidity_2m||50);var dd=d.daily||{};var hi=dd.temperature_2m_max&&dd.temperature_2m_max[0]?Math.round(dd.temperature_2m_max[0]):'--';var lo=dd.temperature_2m_min&&dd.temperature_2m_min[0]?Math.round(dd.temperature_2m_min[0]):'--';el.innerHTML='<div class="wx-main"><div><div class="wx-temp">'+temp+'<span class="wx-deg">&deg;F</span></div><div class="wx-cond">'+eh(desc)+'</div></div><div class="wx-icon">'+icon+'</div></div><div class="wx-grid"><div class="wx-tile"><div class="wx-tlbl">Feels Like</div><div class="wx-tval">'+feels+'&deg;</div></div><div class="wx-tile"><div class="wx-tlbl">Wind</div><div class="wx-tval">'+wind+' mph</div></div><div class="wx-tile"><div class="wx-tlbl">Humidity</div><div class="wx-tval">'+hum+'%</div></div><div class="wx-tile"><div class="wx-tlbl">Hi / Lo</div><div class="wx-tval">'+hi+'&deg; / '+lo+'&deg;</div></div></div>'},onInit:function(){var self=this;self._iv=setInterval(function(){fetchWx(function(d){self._draw(d)})},600000)},onDestroy:function(){clearInterval(this._iv)}};
W['announcement']={id:'announcement',name:'Daily Announcement',icon:'&#128226;',size:'medium',minRole:0,category:'overview',render:function(el){var dd=getDaily();var canEdit=(S.role>=2);var n=new Date();var mos=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];var ds=mos[n.getMonth()]+' '+n.getDate()+', '+n.getFullYear();var editHtml=canEdit?'<span class="edit-lnk" onclick="App.editAnnouncement()">Edit</span>':'';el.innerHTML='<div class="ann-txt">'+eh(dd.announcement||'')+'</div><div class="ann-date">'+ds+' '+editHtml+'</div>'},onInit:function(){}};
W['turf-intel']={id:'turf-intel',name:'Turf Intelligence',icon:'&#127807;',size:'medium',minRole:1,category:'course',_el:null,render:function(el){this._el=el;el.innerHTML='<div style="text-align:center;color:#6B7572;font-size:11px;padding:14px">Loading turf data…</div>';var self=this;fetchWx(function(d){self._draw(d)})},_draw:function(d){var el=this._el;if(!el)return;if(!d){el.innerHTML='<div style="text-align:center;color:#E96A97;font-size:11px;padding:14px">Data unavailable</div>';return}var hr=new Date().getHours();var h=d.hourly||{};var soilT=h.soil_temperature_6cm&&h.soil_temperature_6cm[hr]!=null?Math.round(h.soil_temperature_6cm[hr]):'--';var dewPt=h.dew_point_2m&&h.dew_point_2m[hr]!=null?Math.round(h.dew_point_2m[hr]):'--';var et0=h.et0_fao_evapotranspiration&&h.et0_fao_evapotranspiration[hr]!=null?(+h.et0_fao_evapotranspiration[hr]).toFixed(2):'--';var uv=h.uv_index&&h.uv_index[hr]!=null?Math.round(h.uv_index[hr]):'--';var dd=d.daily||{};var sr=dd.sunrise&&dd.sunrise[0]?fmtTime12(dd.sunrise[0]):'--';var ss2=dd.sunset&&dd.sunset[0]?fmtTime12(dd.sunset[0]):'--';el.innerHTML='<div class="tf-grid"><div class="tf-tile"><div class="tf-lbl">Soil Temp 6cm</div><div class="tf-val">'+soilT+'<span class="tf-unit"> &deg;F</span></div></div><div class="tf-tile"><div class="tf-lbl">Dew Point</div><div class="tf-val">'+dewPt+'<span class="tf-unit"> &deg;F</span></div></div><div class="tf-tile"><div class="tf-lbl">ET&#8320; (Hourly)</div><div class="tf-val">'+et0+'<span class="tf-unit"> in</span></div></div><div class="tf-tile"><div class="tf-lbl">UV Index</div><div class="tf-val">'+uv+'<span class="tf-unit"> / 11</span></div></div></div><div class="tf-sun"><div class="tf-si"><div class="tf-lbl">&#127749; Sunrise</div><div style="font-size:13px;color:#FFFFFF;margin-top:3px">'+sr+'</div></div><div class="tf-si"><div class="tf-lbl">&#127751; Sunset</div><div style="font-size:13px;color:#FFFFFF;margin-top:3px">'+ss2+'</div></div></div>'},onInit:function(){}};
W['forecast']={id:'forecast',name:'5-Day Forecast',icon:'&#128197;',size:'full',minRole:0,category:'course',_el:null,render:function(el){this._el=el;el.innerHTML='<div style="text-align:center;color:#6B7572;font-size:11px;padding:14px">Loading forecast…</div>';var self=this;fetchWx(function(d){self._draw(d)})},_draw:function(d){var el=this._el;if(!el)return;if(!d||!d.daily){el.innerHTML='<div style="text-align:center;color:#E96A97;font-size:11px;padding:14px">Forecast unavailable</div>';return}var dd=d.daily;var dns=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];var html='<div class="fc-row">';for(var i=0;i<Math.min(5,dd.time.length);i++){var dt=new Date(dd.time[i]+'T12:00:00');var dn=i===0?'Today':dns[dt.getDay()];var code=dd.weather_code[i]||0;var icon=WX_ICONS[code]||'&#127775;';var hi=Math.round(dd.temperature_2m_max[i]||70);var lo=Math.round(dd.temperature_2m_min[i]||55);var pr=Math.round(dd.precipitation_probability_max[i]||0);html+='<div class="fc-day"><div class="fc-dname">'+dn+'</div><div class="fc-icon">'+icon+'</div><div class="fc-hi">'+hi+'&deg;</div><div class="fc-lo">'+lo+'&deg;</div><div class="fc-pr">'+pr+'% &#128167;</div></div>'}html+='</div>';el.innerHTML=html},onInit:function(){}};
W['safety']={id:'safety',name:'Safety and Wellness',icon:'&#9888;',size:'medium',minRole:0,category:'course',_el:null,render:function(el){this._el=el;var n=new Date();var tip=SAFETY_TIPS[n.getDate()%SAFETY_TIPS.length];var self=this;fetchWx(function(d){var uvBadge='',heatBadge='';if(d&&d.hourly){var hr=new Date().getHours();var uv=d.hourly.uv_index&&d.hourly.uv_index[hr]!=null?Math.round(d.hourly.uv_index[hr]):null;if(uv!==null){var uc=uv<=2?'bd-low':uv<=5?'bd-mod':uv<=7?'bd-high':'bd-xhi';var ul=uv<=2?'Low':uv<=5?'Moderate':uv<=7?'High':'Very High';uvBadge='<span class="sf-badge '+uc+'">UV '+uv+' &mdash; '+ul+'</span>'}}if(d&&d.current){var tmp=Math.round(d.current.temperature_2m||70);if(tmp<85)heatBadge='<span class="sf-badge bd-low">Heat: Low Risk</span>';else if(tmp<95)heatBadge='<span class="sf-badge bd-mod">Heat: Moderate</span>';else if(tmp<105)heatBadge='<span class="sf-badge bd-high">Heat: High Risk</span>';else heatBadge='<span class="sf-badge bd-xhi">Heat: Extreme</span>'}var bHtml=(uvBadge||heatBadge)?'<div class="sf-badges">'+uvBadge+heatBadge+'</div>':'';el.innerHTML=bHtml+'<div class="sf-title">'+eh(tip.title)+'</div><div class="sf-text">'+eh(tip.text)+'</div>'})},onInit:function(){}};
W['crew-board']={id:'crew-board',name:'Crew Board',icon:'&#128101;',size:'full',minRole:0,category:'team',render:function(el){var crew=getCrew();var jobs=getJobs();var dd=getDaily();var canEdit=(S.role>=1);var canManage=(S.role>=2);var html='<div class="cb-grid">';crew.forEach(function(m){var ass=dd.assignments[m.id]||{job1:m.job1,job2:m.job2};html+='<div class="cb-card"><div class="cb-name">'+eh(m.name)+'</div>';if(canEdit){html+='<select class="cb-sel" data-cid="'+ea(m.id)+'" data-jf="job1" onchange="App.updJob(this)">'+mkOpts(jobs,ass.job1)+'</select>';html+='<select class="cb-sel" data-cid="'+ea(m.id)+'" data-jf="job2" onchange="App.updJob(this)">'+mkOpts(jobs,ass.job2)+'</select>'}else{html+='<div class="cb-jlbl">'+eh(ass.job1)+'</div>';html+='<div class="cb-j2lbl">'+eh(ass.job2)+'</div>'}html+='</div>'});html+='</div>';if(canManage){html+='<button class="cb-addbtn" onclick="App.addCrew()">+ Add Crew Member</button>';html+='<button class="cb-addbtn" style="margin-top:5px" onclick="App.addJob()">+ Add Custom Job</button>'}el.innerHTML=html},onInit:function(){}};
function mkOpts(jobs,sel){var h='';jobs.forEach(function(j){h+='<option value="'+ea(j)+'"'+(j===sel?' selected':'')+'>'+eh(j)+'</option>'});return h}
var PIN_POSITIONS=['C','F','B','L','R'];var PIN_DESC={C:'Center',F:'Front',B:'Back',L:'Left',R:'Right'};var PIN_DOTS={C:{l:'50%',t:'50%'},F:{l:'50%',t:'18%'},B:{l:'50%',t:'78%'},L:{l:'18%',t:'50%'},R:{l:'78%',t:'50%'}};
W['pin-sheet']={id:'pin-sheet',name:'Pin Sheet',icon:'&#128205;',size:'medium',minRole:1,category:'operations',render:function(el){var dd=getDaily();var canEdit=(S.role>=1);var html='<div class="ps-grid">';for(var hole=1;hole<=18;hole++){var pos=(dd.pins&&dd.pins[hole])||'C';var dp=PIN_DOTS[pos]||PIN_DOTS['C'];var ca=canEdit?'onclick="App.cyclePin('+hole+')" style="cursor:pointer"':'style="cursor:default"';html+='<div class="ps-hole" id="psh-'+hole+'" '+ca+' title="Hole '+hole+': '+eh(PIN_DESC[pos])+'"><div class="ps-num">'+hole+'</div><div class="ps-diag" id="psd-'+hole+'"><div class="ps-dot" id="psdot-'+hole+'" style="left:calc('+dp.l+' - 3px);top:calc('+dp.t+' - 3px)"></div></div><div class="ps-lbl" id="pslbl-'+hole+'">'+pos+'</div></div>'}html+='</div>';el.innerHTML=html},onInit:function(){}};
function getLayout(){var k='ll_layout_'+S.role;var saved=sg(k);if(saved&&Array.isArray(saved))return saved;var def=DEFAULT_LAYOUTS[S.role]||DEFAULT_LAYOUTS[0];return JSON.parse(JSON.stringify(def))}function saveLayout(){ss('ll_layout_'+S.role,S.pages)}
function renderPages(){destroyWidgets();var slider=document.getElementById('page-slider');slider.innerHTML='';S.pages.forEach(function(pw,pi){var page=document.createElement('div');page.className='page';page.dataset.page=pi;var grid=document.createElement('div');grid.className='widget-grid';if(!pw||pw.length===0){var nw=document.createElement('div');nw.className='no-wgt';nw.innerHTML='<div>&#9675;</div>No widgets on this page';grid.appendChild(nw)}else{pw.forEach(function(wid){renderWidget(grid,wid,pi)})}page.appendChild(grid);if(S.editMode){var ab=document.createElement('button');ab.className='pg-addbtn';ab.textContent='+ Add Widget to This Page';(function(idx){ab.onclick=function(){App.openWidgetPicker(idx)}})(pi);page.appendChild(ab)}slider.appendChild(page)});if(S.editMode){var apbtn=document.createElement('button');apbtn.className='pg-addbtn';apbtn.style.cssText='display:block;margin:10px 14px;width:calc(100% - 28px)';apbtn.textContent='+ Add New Page';apbtn.onclick=function(){App.addPage()};slider.appendChild(apbtn)}updateDots();gotoPage(S.curPage,false);initWidgets()}
function renderWidget(container,wid,pi){var def=W[wid];if(!def||def.minRole>S.role)return;var card=document.createElement('div');card.className='widget size-'+def.size+(S.editMode?' em':'');card.dataset.wid=wid;card.dataset.page=pi;var rb=document.createElement('button');rb.className='rm-btn';rb.innerHTML='&#10005;';rb.title='Remove';(function(w,p){rb.onclick=function(e){e.stopPropagation();App.removeWidget(p,w)}})(wid,pi);card.appendChild(rb);var od=document.createElement('div');od.className='order-btns';var ub=document.createElement('button');ub.className='order-btn';ub.innerHTML='&#8593;';ub.title='Move up';(function(w,p){ub.onclick=function(e){e.stopPropagation();App.moveWidget(p,w,-1)}})(wid,pi);var db=document.createElement('button');db.className='order-btn';db.innerHTML='&#8595;';db.title='Move down';(function(w,p){db.onclick=function(e){e.stopPropagation();App.moveWidget(p,w,1)}})(wid,pi);od.appendChild(ub);od.appendChild(db);card.appendChild(od);var hdr=document.createElement('div');hdr.className='widget-header';hdr.innerHTML='<span class="widget-icon">'+def.icon+'</span><span class="widget-title">'+eh(def.name)+'</span><span class="widget-cat">'+def.category+'</span>';card.appendChild(hdr);var body=document.createElement('div');body.className='widget-body';body.id='wbody-'+wid;card.appendChild(body);container.appendChild(card);try{def.render(body)}catch(e){body.innerHTML='<div style="color:#E96A97;font-size:10px">Render error</div>'}}

function updateDots(){var c=document.getElementById('page-dots');c.innerHTML='';S.pages.forEach(function(p,i){var dot=document.createElement('div');dot.className='dot'+(i===S.curPage?' active':'');(function(pi){dot.onclick=function(){gotoPage(pi)}})(i);c.appendChild(dot)})}
function gotoPage(idx,animate){if(animate===undefined)animate=true;var total=S.pages.length;idx=Math.max(0,Math.min(total-1,idx));S.curPage=idx;var slider=document.getElementById('page-slider');if(!animate){slider.style.transition='none';setTimeout(function(){slider.style.transition=''},10)}slider.style.transform='translateX(-'+idx*100+'%)';updateDots()}
function initSwipe(){var main=document.getElementById('main');main.addEventListener('touchstart',function(e){S.txStart=e.touches[0].clientX;S.tyStart=e.touches[0].clientY;S.dragging=false},{passive:true});main.addEventListener('touchmove',function(e){var dx=e.touches[0].clientX-S.txStart;var dy=e.touches[0].clientY-S.tyStart;if(!S.dragging&&Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10)S.dragging=true;if(S.dragging){var pct=(S.curPage*100)-(dx/window.innerWidth*100);document.getElementById('page-slider').style.transform='translateX(-'+pct+'%)'}},{passive:true});main.addEventListener('touchend',function(e){if(!S.dragging)return;var dx=e.changedTouches[0].clientX-S.txStart;if(dx<-50)gotoPage(S.curPage+1);else if(dx>50)gotoPage(S.curPage-1);else gotoPage(S.curPage);S.dragging=false});document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')gotoPage(S.curPage+1);else if(e.key==='ArrowLeft')gotoPage(S.curPage-1)})}
function switchTab(tab){S.curTab=tab;document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab)});var cats=TAB_WIDGET_CATS[tab]||[];for(var pi=0;pi<S.pages.length;pi++){for(var wi=0;wi<S.pages[pi].length;wi++){var wid2=S.pages[pi][wi];var def=W[wid2];if(def&&cats.indexOf(def.category)>=0){gotoPage(pi);return}}}gotoPage(0)}

function removeWidget(pi,wid){var pg=S.pages[pi];var idx=pg.indexOf(wid);if(idx>=0)pg.splice(idx,1);if(pg.length===0&&S.pages.length>1){S.pages.splice(pi,1);if(S.curPage>=S.pages.length)S.curPage=S.pages.length-1}renderPages();toast('Widget removed')}
function moveWidget(pi,wid,dir){var pg=S.pages[pi];var idx=pg.indexOf(wid);var ni=idx+dir;if(ni<0||ni>=pg.length)return;var tmp=pg[idx];pg[idx]=pg[ni];pg[ni]=tmp;renderPages()}
function openWidgetPicker(target){S.pickerTarget=(target!==undefined?target:S.curPage);var list=document.getElementById('wp-list');var used=[];S.pages.forEach(function(p){p.forEach(function(w){used.push(w)})});list.innerHTML='';Object.keys(W).forEach(function(wid){var def=W[wid];var noRole=(def.minRole>S.role);var added=(used.indexOf(wid)>=0);var item=document.createElement('div');item.className='pk-item'+((!noRole&&!added)?' avail':'');item.innerHTML='<div class="pk-icon">'+def.icon+'</div><div style="flex:1"><div class="pk-name">'+eh(def.name)+'</div><div class="pk-cat">'+def.category+'</div></div>'+(noRole?'<span style="font-size:9px;color:#6B7572">Role required</span>':added?'<span style="font-size:9px;color:#6B7572">Added</span>':'<button class="pk-add">+ Add</button>');if(!noRole&&!added){(function(w){item.querySelector('.pk-add').onclick=function(){App.addWidget(w)}})(wid)}list.appendChild(item)});document.getElementById('wgt-picker').classList.add('open')}
function closeWidgetPicker(){document.getElementById('wgt-picker').classList.remove('open')}
function addWidget(wid){var t=S.pickerTarget;if(!S.pages[t])S.pages.push([]);S.pages[t].push(wid);closeWidgetPicker();renderPages();toast('Widget added')}
function addPage(){S.pages.push([]);renderPages();gotoPage(S.pages.length-1);toast('New page added')}
function updJob(sel){var id=sel.dataset.cid;var jf=sel.dataset.jf;var dd=getDaily();if(!dd.assignments)dd.assignments={};if(!dd.assignments[id]){var crew=getCrew();var m=null;for(var i=0;i<crew.length;i++){if(crew[i].id===id){m=crew[i];break}}dd.assignments[id]={job1:m?m.job1:'Off',job2:m?m.job2:'Off'}}dd.assignments[id][jf]=sel.value;saveDaily()}
function addCrew(){var jobs=getJobs();var jOpts='';jobs.forEach(function(j){jOpts+='<option value="'+ea(j)+'">'+eh(j)+'</option>'});showModal('Add Crew Member','<label class="m-label">Full Name</label><input class="m-input" id="mn-name" type="text" placeholder="First Last"><label class="m-label">Primary Job</label><select class="m-select" id="mn-job">'+jOpts+'</select>',function(){var name=document.getElementById('mn-name').value.trim();var job=document.getElementById('mn-job').value;if(!name){toast('Name required','pink');return false}var crew=getCrew();crew.push({id:'c'+Date.now(),name:name,job1:job,job2:'Off'});saveCrew();var b=document.getElementById('wbody-crew-board');if(b)W['crew-board'].render(b);toast('Crew member added');return true})}

function cyclePin(hole){var dd=getDaily();if(!dd.pins)dd.pins={};var cur=dd.pins[hole]||'C';var idx=PIN_POSITIONS.indexOf(cur);var next=PIN_POSITIONS[(idx+1)%PIN_POSITIONS.length];dd.pins[hole]=next;saveDaily();var lbl=document.getElementById('pslbl-'+hole);if(lbl)lbl.textContent=next;var dp=PIN_DOTS[next]||PIN_DOTS['C'];var dot=document.getElementById('psdot-'+hole);if(dot){dot.style.left='calc('+dp.l+' - 3px)';dot.style.top='calc('+dp.t+' - 3px)'}var holeEl=document.getElementById('psh-'+hole);if(holeEl)holeEl.title='Hole '+hole+': '+PIN_DESC[next]}
